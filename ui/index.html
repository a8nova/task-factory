<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Factory Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f1f3f5; --surface: #ffffff; --raised: #f7f9fa; --ink: #17202a; --muted: #586472; --line: #d6dce3;
  --accent: #c24a12; --accent-soft: #fbe9df; --ok: #1d7a4b; --ok-soft: #e1f3e9; --doing: #1f5bb8; --doing-soft: #e3ecfa;
  --bad: #b3261e; --bad-soft: #fbe5e3; --warn: #8a5a00; --warn-soft: #f8eccd; --code-bg: #e9edf1;
  --n-laptop: #1f5bb8; --n-gemini: #6a43c4; --n-sandbox: #0f7c86; --n-macmini: #8a5a00; --n-phone: #c24a12; --n-fleet: #586472;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --surface: #191f27; --raised: #1e252e; --ink: #e5eaf0; --muted: #9aa5b2; --line: #2b343f;
    --accent: #f0804a; --accent-soft: #3a2418; --ok: #52c08b; --ok-soft: #173326; --doing: #78a6f0; --doing-soft: #1b2a44;
    --bad: #f08379; --bad-soft: #3a1d1b; --warn: #e0b050; --warn-soft: #3a2f14; --code-bg: #222a34;
    --n-laptop: #78a6f0; --n-gemini: #a98bf0; --n-sandbox: #4fc3cc; --n-macmini: #e0b050; --n-phone: #f0804a; --n-fleet: #9aa5b2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --surface: #191f27; --raised: #1e252e; --ink: #e5eaf0; --muted: #9aa5b2; --line: #2b343f;
  --accent: #f0804a; --accent-soft: #3a2418; --ok: #52c08b; --ok-soft: #173326; --doing: #78a6f0; --doing-soft: #1b2a44;
  --bad: #f08379; --bad-soft: #3a1d1b; --warn: #e0b050; --warn-soft: #3a2f14; --code-bg: #222a34;
  --n-laptop: #78a6f0; --n-gemini: #a98bf0; --n-sandbox: #4fc3cc; --n-macmini: #e0b050; --n-phone: #f0804a; --n-fleet: #9aa5b2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); min-height: 100vh; }
button, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }
a { color: var(--doing); }

/* header */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font: 800 17px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.brand span { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 6px; }
.top select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); }
.conn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.conn b { color: var(--ink); font-weight: 600; }
.factory-state { font-size: 13px; color: var(--muted); min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 520px; }
.factory-state b { color: var(--ink); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.wrap { padding: 16px 20px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 1680px; margin: 0 auto; }
.wrap > *, .main > *, .side > * { min-width: 0; }
.label { font: 700 11px/1 var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 11px 14px 0; }
.panel-h .label { flex: 1; }
.hint { font-size: 12px; color: var(--muted); }

/* status dots */
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.dot.run { background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: ping 1.6s infinite; }
.dot.idle { background: transparent; border: 1.5px solid var(--muted); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  80%, 100% { box-shadow: 0 0 0 7px transparent; } }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 12px;
  font-weight: 600; white-space: nowrap; background: var(--code-bg); color: var(--muted); }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.run { background: var(--accent-soft); color: var(--accent); }
.badge.info { background: var(--doing-soft); color: var(--doing); }

/* where it runs */
.where { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 12px 14px 14px; }
.node { flex: 1 1 0; min-width: 200px; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--raised);
  cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; position: relative; }
.node:hover { border-color: var(--muted); }
.node.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.node.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.node.down { border-color: var(--bad); }
.node-h { display: flex; align-items: center; gap: 8px; }
.glyph { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #fff;
  font: 800 11px/1 var(--display); flex: none; }
.node-h b { font: 700 14px/1.15 var(--display); flex: 1; }
.node-h small { display: block; font: 400 12px/1.2 var(--body); color: var(--muted); }
.node ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; }
.node li { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.node li > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.node li .dot { transform: translateY(1px); }
.wire { flex: 0 0 34px; position: relative; display: flex; align-items: center; }
.wire::before { content: ""; position: absolute; left: 3px; right: 3px; height: 2px; background: var(--line); }
.wire.on::before { background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 11px);
  background-size: 22px 2px; animation: flow .8s linear infinite; }
@keyframes flow { to { background-position: 22px 0; } }
.wire.gap::before { background: repeating-linear-gradient(90deg, var(--line) 0 3px, transparent 3px 7px); }

/* the line of stages */
.line { display: flex; gap: 10px; overflow-x: auto; padding: 12px 14px 14px; }
.group { display: flex; flex-direction: column; gap: 6px; flex: var(--n) 1 0; min-width: calc(var(--n) * 80px); }

.cells { display: flex; gap: 6px; flex: 1; }
.cell { flex: 1 1 0; min-width: 74px; border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 7px;
  background: var(--raised); padding: 7px 8px 8px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 3px; }
.cell:hover { border-color: var(--muted); }
.cell.ok { border-top-color: var(--ok); } .cell.bad { border-top-color: var(--bad); } .cell.warn { border-top-color: var(--warn); }
.cell.run { border-top-color: var(--accent); background: var(--accent-soft); animation: glow 1.8s ease-in-out infinite; }
.cell.idle { border-style: dashed; border-top-style: solid; opacity: .78; }
.cell.sel { outline: 2px solid var(--ink); outline-offset: 1px; opacity: 1; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); } }
.cell-n { display: flex; align-items: center; gap: 6px; font: 700 11px/1 var(--mono); color: var(--muted); }
.cell-n .wh { margin-left: auto; display: flex; gap: 2px; }
.wh i { width: 7px; height: 7px; border-radius: 2px; display: block; }
.cell b { font: 700 13px/1.2 var(--display); }
.cell small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.run small { color: var(--accent); font-weight: 600; }
.cell-ag { display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; font-size: 11.5px; line-height: 1.35; color: var(--muted);
  margin-top: auto; padding-top: 4px; border-top: 1px solid var(--line); }
.cell-ag b { flex-basis: 100%; }
.cell-ag .dot + b { flex-basis: auto; }
.cell-ag b { color: var(--ink); font-weight: 600; }
.cell-ag.run b { color: var(--accent); }
.cell-ag.none, .cell-ag.none b { color: var(--muted); font-weight: 400; }
.group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 0 2px; }
.gcount { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.gcount.run b { color: var(--accent); }
.gcount.none { opacity: .7; }

/* main area */
.main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(340px, 1fr); gap: 16px; align-items: start; }
.side { display: grid; gap: 16px; }
.spot { min-height: 520px; }
.spot-h { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spot-h h2 { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -.01em; }
.spot-h p { margin: 0; color: var(--muted); }
.route { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12.5px; }
.route .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 5px; background: var(--code-bg); }
.route .chip i { width: 8px; height: 8px; border-radius: 2px; }
.route .arrow { color: var(--muted); }
.source { font-size: 12.5px; color: var(--muted); }
.source b { color: var(--ink); font-weight: 600; }
.spot-b { padding: 16px 18px 20px; display: grid; gap: 18px; }
.sec { display: grid; gap: 8px; }
.sec > .label { margin-bottom: 2px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--raised); }
.stat span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { font: 700 21px/1.2 var(--display); }
.stat b.ok { color: var(--ok); } .stat b.bad { color: var(--bad); } .stat b.run { color: var(--accent); }
.stat b { display: block; }
.stat em { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 1px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px/1.2 var(--body); color: var(--muted); }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tablewrap table tr:last-child td { border-bottom: 0; }
ul.findings { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
ul.findings li { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; font-size: 13.5px; }
ul.findings li.bad { border-left-color: var(--bad); } ul.findings li.ok { border-left-color: var(--ok); }
ul.findings li.warn { border-left-color: var(--warn); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; background: var(--raised); display: grid; gap: 6px; align-content: start; }
.card.bad { border-color: var(--bad); background: var(--bad-soft); }
.card.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.card.run { border-color: var(--accent); }
.card h4 { margin: 0; font: 700 14px/1.25 var(--display); }
.card p { margin: 0; font-size: 13px; }
.card .meta { font-size: 12px; color: var(--muted); }
.clickable { cursor: pointer; }
.clickable:hover { border-color: var(--muted); }
pre { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 10px 12px; font: 12px/1.5 var(--mono);
  white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
details > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.bar { height: 6px; border-radius: 3px; background: var(--code-bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--doing); }
.bar.run i { background: var(--accent); }
.timeline { display: grid; gap: 0; }
.ev { display: grid; grid-template-columns: 58px 14px 1fr; gap: 8px; font-size: 13px; padding: 4px 0; }
.ev .t { font: 12px/1.5 var(--mono); color: var(--muted); text-align: right; }
.ev .d { margin-top: 5px; }
.ev.err .x { color: var(--bad); } .ev.hit .x { color: var(--bad); font-weight: 600; }
.ev .x small { color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.files button { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 3px 8px; font: 12px var(--mono); cursor: pointer; }
.files button:hover { border-color: var(--doing); color: var(--doing); }

/* agents list */
.alist { padding: 8px 8px 10px; display: grid; gap: 10px; max-height: 470px; overflow: auto; }
.arun { display: grid; gap: 2px; }
.arun-h { font-size: 12px; color: var(--muted); padding: 2px 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.arun-h b { color: var(--ink); font-weight: 600; }
.arow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 7px 8px;
  border-radius: 7px; cursor: pointer; border: 1px solid transparent; text-align: left; background: none; width: 100%; }
.arow:hover { background: var(--raised); }
.arow.sel { border-color: var(--ink); background: var(--raised); }
.arow .nm { font-weight: 600; font-size: 13.5px; }
.arow .nm small { font-weight: 400; color: var(--muted); }
.arow .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arow .rt { text-align: right; font-size: 12px; }
.arow .bar { margin-top: 4px; }

/* activity */
.feed-filters { display: flex; gap: 4px; }
.feed-filters button { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 1px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
.feed-filters button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.feed { height: 380px; overflow: auto; padding: 8px 10px 10px; font: 12px/1.5 var(--mono); }
.ln { display: grid; grid-template-columns: 58px 64px 1fr; gap: 8px; padding: 1px 0; }
.ln .t { color: var(--muted); }
.ln .s { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln .m { overflow-wrap: anywhere; }
.ln.warn .m { color: var(--warn); } .ln.err .m { color: var(--bad); }

/* file viewer */
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: none; z-index: 20; padding: 4vh 4vw; }
.modal.open { display: grid; }
.modal-box { background: var(--surface); border-radius: 10px; border: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font: 13px var(--mono); }
.modal-h span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal pre { max-height: none; border-radius: 0; height: 100%; }
.diff-add { color: var(--ok); } .diff-del { color: var(--bad); } .diff-hunk { color: var(--doing); }
.offline { padding: 40px; text-align: center; color: var(--muted); }

/* views */
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: var(--raised); padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button.on { background: var(--ink); color: var(--surface); }
.pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.view[hidden] { display: none !important; }
.addrepo { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px 14px; align-items: center; }
.addrepo input { flex: 1 1 360px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); color: var(--ink); font: 14px var(--mono); }
.addrepo input:focus { outline: 2px solid var(--doing); outline-offset: 0; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; padding: 8px 14px; }
.msg { font-size: 13px; } .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.repolist { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 14px 14px; }
.repochip { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; display: grid; gap: 2px; min-width: 220px; }
.repochip.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.repochip b { font: 700 14px/1.2 var(--display); display: flex; gap: 6px; align-items: center; }
.repochip span { font-size: 12px; color: var(--muted); }
.langbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--code-bg); }
.langbar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.verdict { border-radius: 9px; padding: 12px 14px; border: 1px solid var(--line); background: var(--raised); font-size: 14px; }
.verdict.warn { border-color: var(--warn); background: var(--warn-soft); }
.verdict.ok { border-color: var(--ok); background: var(--ok-soft); }
.tokbar { position: relative; height: 8px; border-radius: 4px; background: var(--code-bg); min-width: 90px; overflow: hidden; }
.tokbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--doing); }
.tokbar i.h { background: color-mix(in srgb, var(--doing) 40%, transparent); }
.tokbar i.over { background: var(--bad); }
tr.clickrow { cursor: pointer; } tr.clickrow:hover td { background: var(--raised); }
.prog { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; min-width: 160px; }
.prog i { height: 10px; border-radius: 2px; background: var(--code-bg); display: block; }
.prog i.ok { background: var(--ok); } .prog i.bad { background: var(--bad); } .prog i.warn { background: var(--warn); }
.prog i.run { background: var(--accent); animation: glow 1.8s ease-in-out infinite; }
.accepted { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 12px 14px 14px; }
.acard { border: 1px solid var(--ok); border-radius: 10px; padding: 14px; background: var(--raised); display: grid; gap: 8px; }
.acard h3 { margin: 0; font: 700 16px/1.25 var(--display); }
.empty-card { margin: 12px 14px 14px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; color: var(--muted); font-size: 14px; }
.empty-card b { color: var(--ink); }

/* task page */
.tp-head { padding: 22px 24px 18px; display: grid; gap: 12px; }
.tp-back { font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }
.tp-back:hover { color: var(--ink); }
.tp-head h1 { margin: 0; font: 800 30px/1.12 var(--display); letter-spacing: -.015em; max-width: 1100px; }
.tp-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.tp-meta b { color: var(--ink); font-weight: 600; }
.tp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.tp-strip { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
.tp-strip div { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); text-align: center; min-width: 0; }
.tp-strip i { height: 8px; border-radius: 3px; background: var(--code-bg); display: block; }
.tp-strip i.ok { background: var(--ok); } .tp-strip i.bad { background: var(--bad); } .tp-strip i.warn { background: var(--warn); }
.tp-strip i.run { background: var(--accent); animation: glow 1.8s ease-in-out infinite; }
.tp-strip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { border-radius: 10px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.banner.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
.banner.idle { background: var(--raised); border: 1px solid var(--line); }
.banner.bad { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 50%, var(--line)); }
.banner code { background: var(--surface); padding: 3px 8px; border-radius: 6px; }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 24px; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 14px 10px; font: 600 14px var(--body);
  color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.subtabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.subtabs button small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.tp-body { padding: 20px 24px 26px; }
.pkg { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }
.tree { border: 1px solid var(--line); border-radius: 10px; background: var(--raised); padding: 8px; display: grid; gap: 1px;
  position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
.tree .tdir { font: 600 12.5px var(--mono); padding: 7px 8px 3px; display: flex; justify-content: space-between; gap: 8px; }
.tree .tdir small, .tree .tfile small { font: 400 11px var(--body); color: var(--muted); text-align: right; flex: none; white-space: nowrap; }
.tree .tfile span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .tfile { font: 12.5px var(--mono); padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between;
  gap: 8px; border: 0; background: none; text-align: left; width: 100%; color: var(--ink); }
.tree .tfile:hover { background: var(--code-bg); }
.tree .tfile.on { background: var(--ink); color: var(--surface); }
.tree .tfile.on small { color: var(--surface); opacity: .75; }
.viewer { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); min-width: 0; }
.viewer-h { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--raised); font: 13px var(--mono); }
.viewer-h span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { margin: 0; font: 12.5px/1.6 var(--mono); overflow: auto; max-height: 72vh; counter-reset: ln; padding: 8px 0; }
.code div { white-space: pre; padding: 0 14px 0 0; }
.code div::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 44px; padding-right: 14px; text-align: right;
  color: var(--muted); opacity: .6; user-select: none; }
.code .add { background: color-mix(in srgb, var(--ok) 12%, transparent); } .code .del { background: color-mix(in srgb, var(--bad) 12%, transparent); }
.code .hunk { color: var(--doing); }
.md { padding: 18px 24px 24px; font-size: 14.5px; line-height: 1.6; max-width: 900px; overflow-wrap: anywhere; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--display); line-height: 1.2; margin: 1.3em 0 .5em; }
.md h1 { font-size: 24px; margin-top: .2em; } .md h2 { font-size: 19px; } .md h3 { font-size: 16px; }
.md p { margin: .6em 0; } .md ul, .md ol { padding-left: 1.4em; margin: .5em 0; } .md li { margin: .2em 0; }
.md code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.md pre { margin: .8em 0; } .md pre code { background: none; padding: 0; }
.md table { margin: .8em 0; } .md blockquote { margin: .6em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.prop { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.prop-sec { border-top: 1px solid var(--line); padding: 14px 0; display: grid; gap: 6px; }
.prop-sec:first-child { border-top: 0; padding-top: 0; }
.prop-sec .md { padding: 0; max-width: none; font-size: 14px; }
.rounds { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.rounds button { border: 1px solid var(--line); background: var(--raised); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.rounds button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.side-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--raised); display: grid; gap: 10px; }
.cheat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; background: var(--raised); }
.cheat b { font-size: 13.5px; }
.who { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 18px; }
.who-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--raised); display: grid; gap: 4px; }
.who-card b { font: 700 15px/1.2 var(--display); text-transform: capitalize; }
.who-card .m { font-size: 12.5px; color: var(--muted); }
.tl td { font-size: 13px; }
.tl td.when { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.tl td.num { white-space: nowrap; }
.tl .role { font-weight: 600; text-transform: capitalize; white-space: nowrap; }

@media (max-width: 1560px) {
  .brand span { display: none; }
  .top { gap: 10px; }
}
@media (max-width: 1100px) {
  .main { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .pkg, .prop { grid-template-columns: 1fr; }
  .tree { position: static; max-height: none; }
}
@media (max-width: 700px) {
  .wrap { padding: 12px 16px 24px; }
  .top { padding: 10px 16px; }
  .spot-h h2 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  .dot.run, .cell.run, .wire.on::before { animation: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Task Factory<span>live monitor</span></div>
  <div class="tabs" id="tabs"><button data-view="repos">Repos</button><button data-view="tasks">Tasks</button><button data-view="agents">Agents</button><button data-view="rollouts">Rollouts</button><button data-view="monitor">Monitor</button></div>
  <label class="pick">Repo <select id="repo" aria-label="Repo"></select></label>
  <label class="pick">Task <select id="task" aria-label="Task"></select></label>
  <span class="conn" id="conn"><span class="dot idle"></span>connecting…</span>
  <span class="spacer"></span>
  <button class="btn on" id="follow" title="Spotlight follows whatever is running (F)">Follow live</button>
  <button class="btn" id="theme" title="Switch light or dark">Theme</button>
</header>

<div class="wrap view" id="view-repos" hidden>
  <section class="panel">
    <div class="panel-h"><span class="label">Add a repo</span><span class="hint">Task Factory turns a repo's real speedups into verified agent tasks.</span></div>
    <form class="addrepo" id="addrepo"><input id="repo-url" placeholder="https://github.com/owner/repo" autocomplete="off" spellcheck="false">
      <button class="btn primary" type="submit">Digest repo</button><span class="msg" id="repo-msg"></span></form>
    <div class="repolist" id="repolist"></div>
  </section>
  <section class="panel" id="repo-detail"></section>
</div>

<div class="wrap view" id="view-tasks" hidden>
  <section class="panel">
    <div class="panel-h"><span class="label">Accepted tasks</span></div>
    <div id="accepted"></div>
  </section>
  <section class="panel">
    <div class="panel-h"><span class="label">All tasks</span><span class="hint" id="tasks-hint"></span></div>
    <div style="padding:12px 14px 14px"><div class="tablewrap" id="alltasks"></div></div>
  </section>
</div>

<div class="wrap view" id="view-agents" hidden>
  <section class="panel"><div class="panel-h"><span class="label">Agents</span><span class="hint" id="ag-hint"></span></div>
    <div style="padding:12px 14px 14px" id="ag-stats"></div></section>
  <section class="panel"><div class="panel-h"><span class="label">Running now</span></div><div id="ag-running"></div></section>
  <section class="panel"><div class="panel-h"><span class="label">All managed agents</span><span class="feed-filters" id="ag-filters"></span></div>
    <div style="padding:12px 14px 14px"><div class="tablewrap" id="ag-table"></div></div></section>
</div>

<div class="wrap view" id="view-rollouts" hidden>
  <section class="panel"><div class="panel-h"><span class="label">Rollouts</span><span class="hint" id="ro-hint"></span></div>
    <div style="padding:12px 14px 14px" id="ro-stats"></div></section>
  <div id="ro-tasks" style="display:grid;gap:16px"></div>
</div>

<div class="wrap view" id="view-task" hidden><section class="panel" id="taskpage"></section></div>

<div class="wrap view" id="app">
  <section class="panel">
    <div class="panel-h"><span class="label">Where it runs</span></div>
    <div class="where" id="where"></div>
  </section>
  <section class="panel">
    <div class="panel-h"><span class="label">Stages and agents</span><span class="factory-state" id="factory"></span><span class="hint" id="stage-agents"></span></div>
    <div class="line" id="line"></div>
  </section>
  <div class="main">
    <section class="panel spot" id="spot"></section>
    <div class="side">
      <section class="panel">
        <div class="panel-h"><span class="label">Agents</span><span class="hint" id="agent-count"></span></div>
        <div class="alist" id="agents"></div>
      </section>
      <section class="panel">
        <div class="panel-h"><span class="label">Activity</span>
          <span class="feed-filters" id="feed-filters"></span></div>
        <div class="feed" id="feed"></div>
      </section>
    </div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-h"><span id="modal-title"></span><button class="btn" id="modal-close">Close (Esc)</button></div>
    <pre id="modal-body"></pre>
  </div>
</div>

<script>
"use strict";
// ---- constants ------------------------------------------------------------------------------------------------
const NODES = {
  sandbox: { name: "Antigravity sandboxes", sub: "managed agents", glyph: "AG", color: "var(--n-sandbox)" },
  gemini: { name: "Gemini API", sub: "Argon · Flash · Flash-Lite", glyph: "G", color: "var(--n-gemini)" },
  laptop: { name: "Laptop", sub: "orchestrator", glyph: "L", color: "var(--n-laptop)" },
  macmini: { name: "Mac mini", sub: "gateway, builds", glyph: "M", color: "var(--n-macmini)" },
  phone: { name: "Razr 2020", sub: "Adreno 620 on USB", glyph: "P", color: "var(--n-phone)" },
  fleet: { name: "Device Fleet", sub: "Google Device Run phones", glyph: "F", color: "var(--n-fleet)" },
  cloud: { name: "Cloud Run grader", sub: "tf-gateway · builds · signed grades", glyph: "CR", color: "var(--n-macmini)" },
};
// Grading runs on Cloud Run and every phone run is on Google's Device Run fleet.
const ROW = ["sandbox", "gemini", "cloud", "fleet"];
const GROUPS = [["Find", [1]], ["Propose", [2, 3, 4]], ["Build", [5, 6]], ["Phone gates", [7, 8]], ["Review", [9, 10]],
  ["Agents", [11, 12, 13, 14]], ["Ship", [15, 16]]];
const MODEL = { "gemini-4-argon": "Argon", "gemini-3.8-flash": "Flash 3.8", "gemini-3.5-flash-lite": "Flash-Lite",
  "antigravity-preview-09-2026": "Antigravity" };
const STAGE_MODEL = { 1: "gemini-4-argon", 2: "gemini-4-argon", 3: "gemini-3.5-flash-lite", 4: "gemini-4-argon", 5: "gemini-4-argon",
  9: "gemini-4-argon", 10: "gemini-4-argon", 16: "gemini-4-argon" };
const ROLE = { redteam: "Red team", explorer: "Explorer", calibrator: "Calibrator", rollout: "Rollout", solver: "Solver" };

// ---- state ----------------------------------------------------------------------------------------------------
let S = null;            // latest snapshot from ui/server.py
let SEL = null;          // {type: "stage"|"agent"|"node", id}
let FOLLOW = true;
let FEED = "all";
let lastMsg = 0, source = null, pollTimer = null, PENDING = null, UIV = null;
// After an automatic reload (index.html changed on disk), come back to the same view.
try {
  const back = JSON.parse(sessionStorage.getItem("tf-mon-view") || "null");
  sessionStorage.removeItem("tf-mon-view");
  if (back) { SEL = back.SEL; FOLLOW = back.FOLLOW; FEED = back.FEED || "all"; }
} catch (e) {}
const cache = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let TASK = new URLSearchParams(location.search).get("task") || store.get("tf-mon-task") || "";
let REPO = new URLSearchParams(location.search).get("repo") || store.get("tf-mon-repo") || "";
let VIEW = "tasks", TP = { task: null, data: null, tab: "package", file: null, round: null, files: {}, timer: null };
function readHash() {
  const hsh = decodeURIComponent((location.hash || "").slice(1));
  if (hsh.startsWith("task/")) { VIEW = "task"; TP.task = hsh.slice(5); return; }
  VIEW = ["repos", "tasks", "agents", "rollouts", "monitor"].includes(hsh) ? hsh : store.get("tf-mon-view") || "tasks";
  if (VIEW === "task") VIEW = "tasks";
}
readHash();

// ---- helpers --------------------------------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const short = m => MODEL[m] || m || "—";
const now = () => Date.now() / 1000;
function dur(s) {
  if (s == null || isNaN(s)) return "—";
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h " + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "m";
}
function hms(t) {
  if (!t) return "—";
  const d = new Date(t * 1000);
  return d.toTimeString().slice(0, 8);
}
function ago(t) { return t ? dur(now() - t) + " ago" : "—"; }
function num(v, d = 3) {
  if (v == null || v === "") return "—";
  const n = Number(v);
  return isNaN(n) ? esc(v) : String(+n.toFixed(d));
}
function kfmt(n) { if (!n) return "0"; return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n); }
function cls(status) {
  if (!status) return "idle";
  if (["pass", "approve", "completed", "ok"].includes(status)) return "ok";
  if (["fail", "reject", "timeout", "infra_error", "stopped", "lost", "down"].includes(status)) return "bad";
  if (["return", "fixing", "skipped", "warn"].includes(status)) return "warn";
  if (status === "running") return "run";
  return "idle";
}
const WORD = { pass: "passed", approve: "approved", fail: "failed", reject: "rejected", return: "returned",
  pending: "not run yet", skipped: "skipped", running: "running", fixing: "fixing", completed: "completed",
  timeout: "timed out", infra_error: "infra error", stopped: "stopped" };
const word = s => WORD[s] || s || "—";
function since(t, prefix = "") { return t ? `<span data-since="${t}" data-prefix="${esc(prefix)}">${prefix}${dur(now() - t)}</span>` : ""; }
function stageState(s) { return s.running || s.status; }
function stageById(n) { return S.stages.find(s => s.n === +n); }
function agentById(id) { return S.agents.find(a => a.id === id); }
function setHTML(id, html) {
  if (cache[id] === html) return false;
  cache[id] = html;
  $(id).innerHTML = html;
  return true;
}

// ---- machines -------------------------------------------------------------------------------------------------
function machineView() {
  const m = S.machines, procs = m.laptop.procs || [];
  const running = (S.everywhere || {}).agents || S.agents.filter(a => a.status === "running");
  const factories = (S.everywhere || {}).factories || [];
  const gws = m.gateways || [], mini = m.macmini || {};
  const upGw = gws.filter(g => g.ok);
  const phone = (upGw.find(g => g.phone) || {}).phone;
  const busyGw = gws.find(g => g.ok && g.busy);
  const phoneRuns = mini.phone_runs || [], builds = mini.builds || [];
  const runStages = S.stages.filter(s => s.running);
  const v = {};
  const gemStages = factories.filter(f => STAGE_MODEL[f.stage]);
  const gemActive = running.length || gemStages.length || runStages.some(s => s.where.includes("gemini") || s.where.includes("sandbox"));
  // laptop
  const work = procs.filter(p => p.kind !== "tunnel");
  const tunnels = procs.filter(p => p.kind === "tunnel");
  v.laptop = { state: work.length ? "run" : "ok", active: !!work.length, lines: [
    ...work.map(p => [cls("running"), `<b>${esc(p.kind)}.py</b> ${esc(p.args || "")}`, p.seconds]),
    ...(work.length ? [] : [["idle", "no factory step running"]]),
  ] };
  // gemini
  const use = Object.entries(m.gemini || {});
  v.gemini = { state: gemActive ? "run" : "ok", active: !!gemActive, lines: use.length ? use.map(([model, u]) =>
    [u.active ? "run" : "ok", `<b>${esc(short(model))}</b> ${u.calls} call${u.calls === 1 ? "" : "s"}${u.tokens_in ? " · " + kfmt(u.tokens_in) + " in" : ""}${u.active ? ` · <b>${u.active} live</b>` : ""}`])
    : [["idle", "no calls recorded for this task"]] };
  gemStages.forEach(f => v.gemini.lines.unshift(["run", `<b>now</b>: stage ${f.stage} ${esc(f.label || (stageById(f.stage) || {}).label || "")}${f.task !== S.task ? " · " + esc(f.task) : ""}`]));
  // sandboxes
  const done = S.agents.filter(a => a.status !== "running");
  v.sandbox = { state: running.length ? "run" : "ok", active: !!running.length, lines: [
    ...running.map(a => ["run", `<b>${esc(a.role)}-${a.i}</b> ${esc(short(a.model))} · ${since(a.started)}${a.task !== S.task ? " · " + esc(a.task) : ""}`]),
    [running.length ? "ok" : "idle", `${running.length} running in all tasks · ${done.length} finished for this task`],
  ] };
  // mac mini
  const miniLines = [];
  if (!mini.enabled) miniLines.push(["idle", "ssh checks off (--no-remote)"]);
  else if (mini.reachable === false) miniLines.push(["bad", "ssh failed: " + esc(mini.error || "unreachable")]);
  else if (mini.reachable) miniLines.push(["ok", `ssh ok · ${(mini.gateways || []).length} gateway process${(mini.gateways || []).length === 1 ? "" : "es"}`]);
  else miniLines.push(["idle", "checking ssh…"]);
  gws.forEach(g => miniLines.push([g.ok ? (g.busy ? "run" : "ok") : "bad",
    `gateway ${g.label} :${g.remote} ${g.ok ? (g.busy ? "busy " + esc(g.busy) : "answering") + (g.served != null ? " · " + g.served + " served" : "") : g.checked ? "not answering" : "checking…"}`]));
  builds.slice(0, 2).forEach(b => miniLines.push(["run", `building ${esc(b.tag || "")} · ${dur(b.seconds)}`]));
  const miniActive = !!(builds.length || phoneRuns.length || busyGw);
  v.macmini = { state: mini.reachable === false || !upGw.length ? "bad" : miniActive ? "run" : "ok", active: miniActive, lines: miniLines };
  // phone
  const phoneLines = [];
  if (phone) phoneLines.push(["ok", `${esc(phone.model || "phone")} · ${esc(phone.gpu || "")}`],
    ["ok", `${phone.temp_c != null ? phone.temp_c + "°C" : ""}${phone.battery != null ? " · battery " + phone.battery + "%" : ""}`]);
  else phoneLines.push([gws.some(g => g.checked) ? "bad" : "idle", gws.some(g => g.checked) ? "no gateway reports the phone" : "checking…"]);
  phoneRuns.forEach(r => phoneLines.push(["run", `running ${esc(r.port || "")} ${esc((r.tag || "").slice(0, 12))} · ${dur(r.seconds)}`]));
  if (!phoneRuns.length && phone) phoneLines.push(["idle", busyGw ? "gateway busy: " + esc(busyGw.busy) : "idle"]);
  v.phone = { state: !phone ? (gws.some(g => g.checked) ? "bad" : "idle") : phoneRuns.length || busyGw ? "run" : "ok",
    active: !!(phoneRuns.length || busyGw), lines: phoneLines };
  // fleet
  const f = m.fleet, fleetProc = procs.some(p => p.kind === "devrun_google");
  v.fleet = { state: fleetProc ? "run" : f ? "ok" : "idle", active: fleetProc, lines: f ? [
    [fleetProc ? "run" : "ok", fleetProc ? "session running now" : `last session ${esc(f.when || hms(f.at))}`],
    ["ok", `${f.rows.length} phones · ${f.rows.filter(r => /x$/.test(r[4] || "") && parseFloat(r[4]) > 1.05).length} show the speedup`],
  ] : [["idle", "no fleet session yet"]] };
  // cloud grader
  const cloudGw = gws.find(g => g.label === "cloud") || {};
  v.cloud = { state: cloudGw.ok ? (running.length ? "run" : "ok") : cloudGw.checked ? "bad" : "idle", active: !!(cloudGw.ok && running.length),
    lines: [[cloudGw.ok ? "ok" : cloudGw.checked ? "bad" : "idle", cloudGw.ok ? `answering · ${cloudGw.ms != null ? cloudGw.ms + " ms" : ""}` : cloudGw.checked ? "not answering" : "checking…"],
      ["ok", "builds patches with the Android NDK"], ["ok", "hidden prompts in Secret Manager"]] };
  const cg = m.cloud;
  if (cg) {
    const last = cg.recent[cg.recent.length - 1];
    v.cloud.lines.splice(1, 0, cg.deploying ? ["run", `deploying image ${cg.deploying.image} · ${since(cg.deploying.since)}`]
      : ["ok", `image ${cg.image != null ? cg.image : "—"} · ${esc(cg.revision || "")}`]);
    if (last && !last.ok) v.cloud.lines.splice(2, 0, ["bad", `last ${esc(last.call)}: infra error · ${hms(last.at)}`]);
    if (cg.deploying) v.cloud.active = true;
  }
  if (running.length) v.fleet = { state: "run", active: true, lines: [["run", `${running.length} agent${running.length === 1 ? "" : "s"} grading on Device Run phones`], ...v.fleet.lines] };
  v.wires = {
    "sandbox-gemini": !!running.length,
    "gemini-cloud": !!running.length,
    "cloud-fleet": !!running.length,
  };
  return v;
}

function renderWhere() {
  const v = machineView();
  let html = "";
  ROW.forEach((k, i) => {
    const n = NODES[k], s = v[k];
    if (i) {
      const key = ROW[i - 1] + "-" + k;
      html += `<div class="wire ${key === "phone-fleet" ? "gap" : v.wires[key] ? "on" : ""}" aria-hidden="true"></div>`;
    }
    const sel = SEL && SEL.type === "node" && SEL.id === k;
    html += `<button class="node ${s.active ? "active" : ""} ${s.state === "bad" ? "down" : ""} ${sel ? "sel" : ""}" data-node="${k}">
      <div class="node-h"><span class="glyph" style="background:${n.color}">${n.glyph}</span>
        <b>${n.name}<small>${n.sub}</small></b><span class="dot ${s.state}"></span></div>

// ---- agents per stage ---------------------------------------------------------------------------------------
// The agent each model stage uses; stages 11-14 run agent trials (counted from the run folders); the rest are scripts.
const STAGE_ROLE = { 1: "miner", 2: "author", 3: "checker", 4: "reviewer", 5: "author", 9: "auditor", 10: "reviewer", 16: "signer" };
const TRIAL_ROLE = { 11: "explorer", 12: "calibrator", 13: "attacker", 14: "solver" };
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
function stageAgents(s) {
  if (TRIAL_ROLE[s.n]) {
    const list = S.agents.filter(a => a.stage === s.n);
    const out = { n: list.length, run: list.filter(a => a.status === "running").length, role: TRIAL_ROLE[s.n],
      model: list.length ? short(list[list.length - 1].model) : "" };
    if (s.n === 13 && (S.work.fixes || []).length) { out.n += 1; out.extra = "fixer"; }
    return out;
  }
  if (s.approved_by === "user") return { n: 1, run: 0, role: "you", model: "approved by hand" };
  if (STAGE_ROLE[s.n]) {
    const used = s.status !== "pending" || s.running;
    return { n: used ? 1 : 0, run: s.running ? 1 : 0, role: STAGE_ROLE[s.n], model: short(s.model || STAGE_MODEL[s.n]) };
  }
  return { n: 0, run: 0, role: null };
}
function agentLine(a) {
  if (!a.role) return `<span class="cell-ag none">no agent</span>`;
  const who = a.role === "you" ? "you" : a.n ? plural(a.n - (a.extra ? 1 : 0), a.role) + (a.extra ? " + " + a.extra : "") : a.role;
  return `<span class="cell-ag ${a.run ? "run" : a.n ? "" : "none"}">${a.run ? '<span class="dot run"></span>' : ""}<b>${esc(who)}</b><span>${esc(a.model || "")}${a.run ? ` · ${a.run} live` : ""}</span></span>`;
}

// ---- stage line -----------------------------------------------------------------------------------------------
function cellMeta(s) {
  if (s.running) return (s.running === "fixing" ? "fixing " : "running ") + (s.running_since ? since(s.running_since) : "");
  if (s.status === "pending") return "not run yet";
  const bits = [word(s.status)];
  if (s.round > 1) bits.push("round " + s.round);
  if (s.from_files) bits.push("from files");
  else if (s.seconds != null) bits.push(dur(s.seconds));
  return esc(bits.join(" · "));
}
function renderLine() {
  let total = 0, live = 0;
  const html = GROUPS.map(([name, ns]) => {
    const ag = ns.map(n => stageAgents(stageById(n)));
    const gn = ag.reduce((x, a) => x + a.n, 0), gr = ag.reduce((x, a) => x + a.run, 0);
    total += gn; live += gr;
    return `<div class="group" style="--n:${ns.length}"><div class="group-h"><span class="label">${name}</span>
      <span class="gcount ${gr ? "run" : gn ? "" : "none"}">${gr ? `<span class="dot run"></span><b>${gr} running</b> · ` : ""}${plural(gn, "agent")}</span></div><div class="cells">${
    ns.map((n, k) => {
      const s = stageById(n), c = cls(stageState(s)), sel = SEL && SEL.type === "stage" && SEL.id === n;
      return `<button class="cell ${c} ${sel ? "sel" : ""}" data-stage="${n}" title="${esc(s.what)}">
        <span class="cell-n"><span class="dot ${c}"></span>${n}<span class="wh">${s.where.map(w => `<i style="background:${NODES[w].color}" title="${NODES[w].name}"></i>`).join("")}</span></span>
        <b>${esc(s.label)}</b><small>${cellMeta(s)}</small>${agentLine(ag[k])}</button>`;
    }).join("")}</div></div>`;
  }).join("");
  setHTML("line", html);
  setHTML("stage-agents", `${plural(total, "agent")} in this task${live ? ` · <b style="color:var(--accent)">${live} running</b>` : ""}`);
}

// ---- agents panel ---------------------------------------------------------------------------------------------
function agentSub(a) {
  if (a.status === "running") {
    const last = a.events[a.events.length - 1];
    return last ? last.text : "starting…";
  }
  if (a.role === "redteam" && a.attack) return a.attack;
  const t = a.trajectory && a.trajectory.tried && a.trajectory.tried[0];
  return t || (a.events.length ? a.events[a.events.length - 1].text : "");
}
function regradeBadge(a) {
  const g = a.regrade;
  if (!g) return "";
  if (g.pending) return `<span class="badge run">regrading…</span>`;
  if (g.infra_error) return `<span class="badge warn" title="${esc(g.infra_error)}">regrade: infra error</span>`;
  if (g.error) return `<span class="badge bad" title="${esc(g.error)}">regrade: error</span>`;
  return `<span class="badge ${g.reward > 0 ? "ok" : "bad"}">regraded ${num(g.reward, 2)}${g.speedup ? " · " + num(g.speedup, 2) + "×" : ""}</span>`;
}
function agentRight(a) {
  if (a.regrade) return regradeBadge(a);
  if (a.status === "running") return `<span class="badge run">${since(a.started)}</span>`;
  const r = a.best_reward;
  if (a.role === "redteam" && r > 0) return `<span class="badge bad">broke grader · ${num(r, 2)}</span>`;
  if (a.role === "redteam") return `<span class="badge ok">scored 0</span>`;
  return `<span class="badge ${cls(a.status)}">${esc(word(a.status))}${r != null ? " · " + num(r, 2) : ""}</span>`;
}
function renderAgents() {
  const runs = [];
  S.agents.forEach(a => {
    let r = runs.find(x => x.run === a.run);
    if (!r) runs.push(r = { run: a.run, role: a.role, model: a.model, started: a.started, list: [] });
    r.list.push(a);
  });
  const running = S.agents.filter(a => a.status === "running").length;
  const elsewhere = ((S.everywhere || {}).agents || []).filter(a => a.task !== S.task);
  setHTML("agent-count", `${running} running · ${S.agents.length} for this task${elsewhere.length ? ` · ${elsewhere.length} running in other tasks` : ""}`);
  const other = elsewhere.length ? `<div class="arun"><div class="arun-h"><b>Running in other tasks</b><span>click to switch</span></div>${elsewhere.map(a =>
    `<button class="arow" data-goto-task="${esc(a.task)}" data-goto-agent="${esc(a.id)}"><span class="dot run"></span>
      <span style="min-width:0"><span class="nm">${esc(a.role)}-${a.i} <small>${esc(short(a.model))} · ${esc(a.task)}</small></span><div class="sub">${esc(a.last || "starting…")}</div></span>
      <span class="rt"><span class="badge run">${since(a.started)}</span></span></button>`).join("")}</div>` : "";
  const html = other + (runs.length ? runs.map(r => `<div class="arun">
    <div class="arun-h"><b>${esc(ROLE[r.role] || r.role)}</b><span>${esc(short(r.model))}</span><span>· started ${hms(r.started)}</span>${r.list[0].dry_run ? "<span>· dry run</span>" : ""}</div>
    ${r.list.map(a => {
      const sel = SEL && SEL.type === "agent" && SEL.id === a.id, c = a.role === "redteam" && a.best_reward > 0 ? "bad" : cls(a.status);
      const bar = a.status === "running" && a.budget ? `<div class="bar run"><i data-bar-start="${a.started}" data-bar-budget="${a.budget}" style="width:${Math.min(100, (now() - a.started) / a.budget * 100)}%"></i></div>` : "";
      return `<button class="arow ${sel ? "sel" : ""}" data-agent="${esc(a.id)}">
        <span class="dot ${c}"></span>
        <span style="min-width:0"><span class="nm">${esc(a.role)}-${a.i} <small>${esc(short(a.model))}</small></span>
          <div class="sub">${esc(agentSub(a))}</div>${bar}</span>
        <span class="rt">${agentRight(a)}</span></button>`;
    }).join("")}</div>`).join("") : `<div class="empty" style="padding:8px">No agents have run for this task yet.</div>`);
  setHTML("agents", html);
}

// ---- activity -------------------------------------------------------------------------------------------------
const FEEDS = [["all", "All"], ["factory", "Factory"], ["agents", "Agents"], ["cloud", "Grader"]];
const isCloud = l => /cloud|regrade|fleet/.test(l.src);
function renderFeed() {
  setHTML("feed-filters", FEEDS.map(([k, t]) => `<button data-feed="${k}" class="${FEED === k ? "on" : ""}">${t}</button>`).join(""));
  const lines = S.log.filter(l => FEED === "all" || (FEED === "cloud" ? isCloud(l) : FEED === "agents" ? l.src === "agents" : l.src !== "agents" && !isCloud(l)));
  const el = $("feed"), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  const html = lines.length ? lines.map(l => {
    const c = l.level === "WARNING" ? "warn" : l.level === "ERROR" ? "err" : /error|failed|crash/i.test(l.text) ? "err" : "";
    const color = isCloud(l) ? "var(--n-macmini)" : l.src === "agents" ? "var(--n-sandbox)" : "var(--n-gemini)";
    return `<div class="ln ${c}"><span class="t">${hms(l.at)}</span><span class="s" style="color:${color}" title="${esc(l.src)}.log">${esc(l.src)}</span><span class="m">${esc(l.text)}</span></div>`;
  }).join("") : `<div class="empty">Nothing logged yet.</div>`;
  if (setHTML("feed", html) && atBottom) el.scrollTop = el.scrollHeight;
}

// ---- spotlight: shared pieces ---------------------------------------------------------------------------------
function route(where) {
  if (!where || !where.length) return "";
  return `<div class="route"><span class="label" style="margin-right:6px">Runs on</span>${where.map((w, i) =>
    `${i ? '<span class="arrow">→</span>' : ""}<span class="chip"><i style="background:${NODES[w].color}"></i>${NODES[w].name}</span>`).join("")}</div>`;
}
function stat(label, value, c = "", extra = "") { return `<div class="stat"><span>${label}</span><b class="${c}">${value}</b>${extra ? `<em>${extra}</em>` : ""}</div>`; }
function findings(list, c = "") {
  if (!list || !list.length) return "";
  return `<ul class="findings">${list.map(f => `<li class="${c}">${esc(f)}</li>`).join("")}</ul>`;
}
function fileButtons(files) {
  if (!files || !files.length) return "";
  return `<div class="files">${files.map(f => `<button data-file="${esc(f)}">${esc(f.split("/").slice(-2).join("/"))}</button>`).join("")}</div>`;
}
function kv(obj) {
  const rows = Object.entries(obj || {}).filter(([, v]) => v != null && v !== "" && !(Array.isArray(v) && !v.length));
  if (!rows.length) return "";
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${typeof v === "object" ? `<code>${esc(JSON.stringify(v))}</code>` : esc(v)}</dd>`).join("")}</dl>`;
}
function ledgerHistory(s) {
  if (!s.history.length) return "";
  return `<div class="sec"><span class="label">Ledger history (${s.history.length} verdict${s.history.length === 1 ? "" : "s"})</span>
    <div class="tablewrap"><table><tr><th>Round</th><th>Verdict</th><th>When</th><th class="num">Time</th><th>Model</th><th>First finding</th></tr>
    ${s.history.map(h => `<tr><td>${h.round}</td><td><span class="badge ${cls(h.verdict)}">${esc(word(h.verdict))}</span></td><td class="mono">${esc((h.ts || "").slice(11))}</td>
      <td class="num">${dur(h.seconds)}</td><td>${esc(short(h.model))}</td><td>${esc((h.findings[0] || "").slice(0, 180))}</td></tr>`).join("")}</table></div></div>`;
}
function gateResult(r, title, want) {
  if (!r) return "";
  const d = r.decode_tok_s || {};
  return `<div class="sec"><span class="label">${title}</span>
    <div class="stats">${stat("Reward", num(r.reward, 3), (r.reward || 0) === want ? "ok" : "bad", want === 0 ? "must be 0" : "must be 1")}
      ${stat("Speedup", num(r.speedup, 3) + "×", "", "needs " + num(r.needed_speedup, 3) + "×")}
      ${stat("Candidate", num(d.candidate, 2), "", "tok/s decode")}${stat("Base", num(d.base, 2), "", "tok/s")}${stat("Reference", num(d.reference, 2), "", "tok/s")}
      ${stat("Gateway time", dur(r.gateway_seconds), "", "build " + dur(r.build_seconds))}</div>
    ${r.checks ? `<div class="tablewrap"><table><tr><th>Input</th><th class="num">Tokens checked</th><th>Tokens match</th></tr>${r.checks.map(c =>
      `<tr><td>${esc(c.input)}</td><td class="num">${c.required_tokens}</td><td>${c.match ? '<span class="badge ok">match</span>' : '<span class="badge bad">differ</span>'}</td></tr>`).join("")}</table></div>` : ""}
    ${r.flags && r.flags.length ? findings(r.flags, want === 0 ? "ok" : "bad") : ""}
    ${r.device && r.device.raw ? `<div class="hint">${esc(r.device.raw.slice(3).join(" "))} · ${esc(r.device.raw[2])}</div>` : ""}</div>`;
}

const STAGE_BODY = {
  1() {

      `<div class="card ${c.passed ? "ok" : "bad"}"><h4><span class="dot ${c.passed ? "ok" : "bad"}"></span> ${esc(c.check)}</h4>${c.passed ? "" : `<p>${esc(c.finding)}</p>`}</div>`).join("")}</div></div>`;
    if (q && q.flaws) out += `<div class="sec"><span class="label">Does QA catch planted flaws? ${esc(q.catch_rate)} caught</span>
      <div class="tablewrap"><table><tr><th>Planted flaw</th><th>Caught</th><th>By</th><th>Evidence</th></tr>${q.flaws.map(f =>
      `<tr><td class="mono">${esc(f.flaw)}</td><td>${f.caught ? '<span class="badge ok">yes</span>' : '<span class="badge bad">no</span>'}</td><td>${esc((f.caught_by || []).join(", "))}</td><td>${esc((f.evidence || "").slice(0, 160))}</td></tr>`).join("")}</table></div></div>`;
    return out;

  },

    return out;
  },

function scoringPanel(withRows, given) {
  const sc = given || S.work.scoring;
  if (!sc || !sc.target) return "";
  const T = sc.target, base = sc.base_tok_s, steps = [0, 0.25, 0.5, 0.75, 1], w = sc.window || {};
  let rows = "";
  if (withRows && sc.rows.length) {
    const byModel = {};
    sc.rows.forEach(r => { if (r.reward != null) (byModel[r.model] = byModel[r.model] || []).push(r.reward); });
    const verdicts = Object.entries(byModel).map(([m, rs]) => {
      const mean = rs.reduce((a, b) => a + b, 0) / rs.length, v = rs.reduce((a, b) => a + (b - mean) ** 2, 0) / rs.length;
      const okM = w.mean_max == null || mean <= w.mean_max, okV = w.variance_min == null || v > w.variance_min;
      return `<div class="stats">${stat(esc(short(m)) + " rollouts", rs.length, "", w.trials ? "need " + w.trials : "")}
        ${stat("Mean reward", num(mean, 3), okM ? "ok" : "bad", w.mean_max != null ? "must be ≤ " + w.mean_max : "")}
        ${stat("Variance", num(v, 4), okV ? "ok" : "bad", w.variance_min != null ? "must be > " + w.variance_min : "")}</div>`;
    }).join("");
    rows = `<div class="sec"><span class="label">Rollouts</span><div class="tablewrap"><table>
      <tr><th>Rollout</th><th>Model</th><th>Result from</th><th>Valid</th><th class="num">Speedup</th><th class="num">Reward</th></tr>
      ${sc.rows.map(r => `<tr><td class="mono">${esc((r.run || "").slice(0, 15))}/rollout-${r.i}</td><td>${esc(short(r.model))}</td>
        <td><span class="badge ${r.via === "regrade" || r.via === "submit" ? "ok" : r.via === "running" ? "run" : r.via === "infra error" ? "warn" : ""}">${esc(r.via)}</span></td>
        <td>${r.valid == null ? "—" : r.valid ? '<span class="badge ok">valid</span>' : '<span class="badge bad">invalid</span>'}</td>
        <td class="num">${r.speedup ? num(r.speedup, 3) + "×" : "—"}</td><td class="num"><b>${num(r.reward, 3)}</b></td></tr>`).join("")}</table></div>
      ${verdicts}</div>`;
  }
  return `<div class="sec"><span class="label">Scoring</span>
    <div class="verdict"><b>reward = clip((speedup − 1) / (target − 1), 0, 1)</b>, linear, when valid; otherwise 0. Infra errors give no reward.</div>
    <ul class="findings">
      <li><b>Valid:</b> the patch builds and runs, touches no off-limits file, and its output tokens exactly match a trusted implementation (reference or base) on every hidden prompt at every timed length.</li>
      <li><b>Metric:</b> ${esc(sc.rule.metric || "decode tokens/s")} on a Pixel 5 (Adreno 620), Device Run fleet, ${esc(sc.rule.measured || "")}; ${esc(sc.rule.aggregate || "")}.</li>
      <li><b>Speedup</b> = candidate decode ÷ base decode; ${esc(sc.rule.baseline || "")}.</li></ul>
    <div class="stats">${stat("Baseline", base ? num(base, 2) + " tok/s" : "—", "", "reward 0 · latest session")}
      ${stat("Target", num(T, 3) + "×", "", (base ? num(base * T, 2) + " tok/s · " : "") + "reward 1 · " + esc(sc.rule.target_source || ""))}</div>
    <div class="tablewrap"><table><tr><th>Reward</th>${steps.map(r => `<td class="num">${num(r, 2)}</td>`).join("")}</tr>
      <tr><th>Speedup needed</th>${steps.map(r => `<td class="num">${num(1 + r * (T - 1), 3)}×</td>`).join("")}</tr>
      ${base ? `<tr><th>Decode tok/s needed</th>${steps.map(r => `<td class="num">${num(base * (1 + r * (T - 1)), 2)}</td>`).join("")}</tr>` : ""}</table></div></div>${rows}`;
}

// ---- task page ------------------------------------------------------------------------------------------------
function inline(t) {

function md(src) {

    const hm = l.match(/^(#{1,4})\s+(.*)$/);

      const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<div class="tablewrap"><table><tr>${cells(body[0]).map(c => `<th>${c}</th>`).join("")}</tr>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`);
      continue;

      while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        if (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s{4,}/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        else if (items.length) items[items.length - 1] += " " + lines[i].trim().replace(/^([-*]|\d+\.)\s+/, "· ");
        else items.push(lines[i].trim().replace(/^([-*]|\d+\.)\s+/, ""));
        i++;
      }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (/^&gt;\s?/.test(l)) { out.push(`<blockquote>${inline(l.replace(/^&gt;\s?/, ""))}</blockquote>`); i++; continue; }
    if (!l.trim()) { i++; continue; }

    while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*([-*]|\d+\.)\s+|\s*\|)/.test(lines[i])) para.push(lines[i++]);
