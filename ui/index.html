  const TOP = { "instruction.md": "agent prompt", "task.toml": "config", "README.md": "overview" };
  const tree = order.filter(k => groups[k]).map(k => `${k ? `<div class="tdir">${esc(k)}/<small>${esc(PART[k] || "")}</small></div>` : ""}${groups[k].map(f =>
    `<button class="tfile ${TP.file === f.full ? "on" : ""}" data-pkgfile="${esc(f.full)}" style="${k ? "padding-left:20px" : ""}"><span>${esc(k ? f.path.slice(k.length + 1) : f.path)}</span><small>${!k && TOP[f.path] ? TOP[f.path] : kfmt(f.bytes) + "B"}</small></button>`).join("")}`).join("");
  const f = d.package.find(x => x.full === TP.file) || d.package[0];
  loadFile(f.full);
  const text = TP.files[f.full];
  const body = text == null ? '<div class="empty" style="padding:14px">loading…</div>' : /\.md$/.test(f.path) ? `<div class="md">${md(text)}</div>` : codeView(f.path, text);
  return `<div class="pkg"><div class="tree">${tree}</div>
    <div class="viewer"><div class="viewer-h"><span>${esc(d.package_dir)}/${esc(f.path)}</span><span style="flex:0">${kfmt(f.bytes)}B</span></div>${body}</div></div>`;
}
const PROP_FIELDS = [["problem_statement", "Problem"], ["starter_method", "Starting point"], ["deliverable", "Deliverable"], ["metric", "Metric"],
  ["correctness_rule", "Correctness"], ["reward", "Reward"], ["why_hard", "Why it's hard"], ["cheat_resistance", "Cheats and defenses"],
  ["resources", "Resources"], ["agent_time_budget_sec", "Time budget"], ["baseline_expectation", "Baseline"], ["reference_solution", "Reference solution"],
  ["open_questions", "Open questions"]];
function propValue(k, v) {
  if (v == null || v === "") return "";
  if (k === "agent_time_budget_sec") return `<p>${dur(v)}</p>`;
  if (k === "cheat_resistance" && Array.isArray(v)) return `<div style="display:grid;gap:8px">${v.map(c => typeof c === "object"
    ? `<div class="cheat"><b>${inline(esc(c.cheat || c.name || ""))}</b><div class="md">${md(c.defense || c.how_prevented || c.mitigation || c.prevention || Object.entries(c).filter(([x]) => x !== "cheat").map(([, y]) => y).join(" "))}</div></div>`
    : `<div class="cheat">${md(String(c))}</div>`).join("")}</div>`;
  if (Array.isArray(v)) return `<ul>${v.map(x => `<li>${typeof x === "object" ? inline(esc(JSON.stringify(x))) : md(String(x)).replace(/^<p>|<\/p>$/g, "")}</li>`).join("")}</ul>`;
  if (typeof v === "object") return `<dl class="kv">${Object.entries(v).map(([a, b]) => `<dt>${esc(a.replace(/_/g, " "))}</dt><dd>${typeof b === "object" ? `<code>${esc(JSON.stringify(b))}</code>` : md(String(b)).replace(/^<p>|<\/p>$/g, "")}</dd>`).join("")}</dl>`;
  return md(String(v));
}
function proposalTab(d) {
  if (!d.proposals.length) return `<div class="empty-card"><b>No proposal yet.</b> Stage 2 writes it.</div>`;
  const r = d.proposals[Math.min(TP.round, d.proposals.length - 1)], pr = r.proposal || {}, ag = r.agent || {};
  const qa = (d.stages.find(s => s.n === 3) || {}).history || [], rv = (d.stages.find(s => s.n === 4) || {}).history || [];
  const lastQa = qa[qa.length - 1], lastRv = rv[rv.length - 1];
  const checks = lastQa && lastQa.details && lastQa.details.checks || [];
  return `<div class="rounds">${d.proposals.map((x, i) => `<button class="${i === TP.round ? "on" : ""}" data-round="${i}">${x.round === "current" ? "Current" : "Round " + x.round}</button>`).join("")}</div>
    <div class="prop"><div>
      <div class="prop-sec"><span class="label">Title</span><h2 style="margin:0;font:800 22px/1.2 var(--display)">${esc(pr.title)}</h2>
        <div class="tp-meta"><span>by <b>author · ${esc(short(ag.model))}</b></span>${ag.seconds ? `<span>${dur(ag.seconds)}</span>` : ""}${ag.input_tokens ? `<span>${kfmt(ag.input_tokens)} in · ${kfmt(ag.output_tokens)} out</span>` : ""}
          <span>difficulty <b>${esc(pr.expected_difficulty || "—")}</b></span><span><code>${esc(pr.slug || "")}</code></span></div></div>
      ${PROP_FIELDS.filter(([k]) => pr[k] != null && pr[k] !== "").map(([k, t]) => `<div class="prop-sec"><span class="label">${t}</span><div class="md">${propValue(k, pr[k])}</div></div>`).join("")}
    </div><div style="display:grid;gap:12px;position:sticky;top:70px">
      <div class="side-card"><span class="label">Checker · ${esc(short(lastQa && lastQa.model))}</span>${lastQa ? `<span class="badge ${cls(lastQa.verdict)}">${esc(word(lastQa.verdict))} · round ${lastQa.round}</span>
        <ul class="findings">${checks.map(c => `<li class="${c.passed ? "ok" : "bad"}"><b>${esc(c.check)}</b>${c.passed ? "" : " · " + esc(c.finding)}</li>`).join("")}</ul>` : '<div class="empty">Not run.</div>'}</div>
      <div class="side-card"><span class="label">Reviewer · ${esc(short(lastRv && lastRv.model))}</span>${lastRv ? `<span class="badge ${cls(lastRv.verdict)}">${esc(word(lastRv.verdict))}</span>
        ${lastRv.details && lastRv.details.summary ? `<p style="margin:0;font-size:13.5px">${esc(lastRv.details.summary)}</p>` : ""}${findings(lastRv.findings, "warn")}` : '<div class="empty">Not run.</div>'}</div>
    </div></div>`;
}
function whoTab(d) {
  const cards = d.roles.map(r => `<div class="who-card"><b>${esc(r.role)}</b><span class="m">${esc(r.models.length ? r.models.map(short).join(", ") : "no model")}</span>
    <span class="m">${plural(r.runs, "run")}${r.seconds ? " · " + dur(r.seconds) : ""}${r.tokens_in ? " · " + kfmt(r.tokens_in) + " in" : ""}</span>
    <span class="m">${r.stages.length ? "stage " + r.stages.sort((a, b) => a - b).join(", ") : ""}</span></div>`).join("");
  const rows = d.events.map(e => `<tr>
    <td class="when">${hms(e.at)}</td><td class="mono">${e.stage || "—"}</td>
    <td><span class="role">${esc(e.role || "")}</span><div class="hint">${esc(e.model ? short(e.model) : "")}</div></td>
    <td>${esc(e.did || "")}${e.findings && e.findings.length ? `<details><summary>${plural(e.findings.length, "detail")}</summary>${findings(e.findings)}</details>` : ""}
      ${e.file ? `<div class="files" style="margin-top:4px"><button data-file="${esc(e.file)}">${esc(e.file.split("/").pop())}</button></div>` : ""}</td>
    <td><span class="badge ${e.verdict === "fix" ? "info" : cls(e.verdict)}">${esc(e.verdict === "fix" ? "fix" : word(e.verdict))}</span></td>
    <td class="num">${e.seconds != null ? dur(e.seconds) : "—"}</td><td class="num">${e.tokens && e.tokens[0] ? kfmt(e.tokens[0]) : "—"}</td></tr>`).join("");
  return `<div class="who">${cards}</div><div class="tablewrap tl"><table><tr><th>Time</th><th>Stage</th><th>Agent</th><th>What it did</th><th>Result</th><th class="num">Took</th><th class="num">Tokens in</th></tr>${rows}</table></div>`;
}
function renderTaskPage() {
  const d = TP.data;
  if (!d) return setHTML("taskpage", `<div class="tp-head"><button class="tp-back" data-view="tasks">← All tasks</button><div class="empty">loading…</div></div>`);
  if (d.error) return setHTML("taskpage", `<div class="tp-head"><button class="tp-back" data-view="tasks">← All tasks</button><div class="empty">${esc(d.error)}</div></div>`);
  const [c, txt] = tpState(d), sp = d.spec || {};
  const head = `<div class="tp-head"><button class="tp-back" data-view="tasks">← All tasks</button>
    <h1>${esc(d.title || d.task)}</h1>
    <div class="tp-meta"><span><code>${esc(d.task)}</code></span><span>${esc(d.port || "")}</span>${sp.base ? `<span>base <b class="mono">${esc(String(sp.base).slice(0, 7))}</b> → reference <b class="mono">${esc(String(sp.reference || "").slice(0, 7))}</b></span>` : ""}
      ${d.difficulty ? `<span>difficulty <b>${esc(d.difficulty)}</b></span>` : ""}${d.agent_timeout ? `<span>agent time <b>${dur(d.agent_timeout)}</b></span>` : ""}
      ${sp.reference_speedup ? `<span>reference <b>${num(sp.reference_speedup, 2)}×</b></span>` : ""}${sp.phone ? `<span>${esc(sp.phone)}</span>` : ""}</div>
    <div class="tp-strip">${d.stages.map(s => `<div title="${s.n} ${esc(s.label)}: ${esc(word(s.running || s.status))}"><i class="${s.running ? "run" : cls(s.status)}"></i><span>${s.n}</span></div>`).join("")}</div>
    <div class="banner ${c === "ok" ? "ok" : c === "bad" ? "bad" : "idle"}"><span class="badge ${c}"><span class="dot ${c}"></span>${esc(txt)}</span>
      ${d.package_dir ? `<span>Run it: <code>harbor run --path ${esc(d.package_dir)} --agent &lt;agent&gt;</code></span>` : ""}
      <span class="spacer"></span><button class="btn" data-monitor-task="${esc(d.task)}">Live monitor →</button></div></div>`;
  const tabs = [["package", "Harbor package", d.package.length + " files"], ["proposal", "Proposal", d.proposals.length ? plural(d.proposals.length, "round") : ""],
    ["who", "Agents", plural(d.roles.length, "role")]];
  const body = TP.tab === "proposal" ? proposalTab(d) : TP.tab === "who" ? whoTab(d) : pkgTab(d);
  const keep = document.querySelector("#taskpage .code, #taskpage .viewer .md"), top = keep ? keep.scrollTop : 0;
  setHTML("taskpage", `${head}<div class="subtabs">${tabs.map(([k, t, n]) => `<button class="${TP.tab === k ? "on" : ""}" data-tptab="${k}">${t}<small>${esc(n)}</small></button>`).join("")}</div>
    <div class="tp-body">${body}</div>`);
  const again = document.querySelector("#taskpage .code, #taskpage .viewer .md");
  if (again && top) again.scrollTop = top;
}

// ---- header ---------------------------------------------------------------------------------------------------
function renderHeader() {
  const sel = $("task");
  const opts = S.tasks.length ? S.tasks.map(t => `<option value="${esc(t)}" ${t === S.task ? "selected" : ""}>${esc(t)}</option>`).join("") : `<option value="">no tasks yet</option>`;
  if (cache.task !== opts) { cache.task = opts; sel.innerHTML = opts; }
  const ro = S.repos.map(r => `<option value="${esc(r.slug)}" ${r.slug === S.repo_slug ? "selected" : ""}>${esc(r.name || r.slug)}${r.status !== "done" ? " (" + esc(r.status) + ")" : ""}</option>`).join("") + `<option value="__add">+ Add a repo from a link…</option>`;
  if (cache.repo !== ro) { cache.repo = ro; $("repo").innerHTML = ro; }
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === (VIEW === "task" ? "tasks" : VIEW)));
  ["repos", "tasks", "task", "agents", "rollouts"].forEach(v => { $("view-" + v).hidden = VIEW !== v; });
  $("app").hidden = VIEW !== "monitor";
  const f = S.factory;
  setHTML("factory", f ? `factory.py on <b>stage ${f.stage} ${esc((stageById(f.stage) || {}).label || "")}${f.fixing ? " (fixing)" : ""}</b>` : "");
  $("follow").classList.toggle("on", FOLLOW);
  $("follow").hidden = VIEW !== "monitor";
}
function renderConn() {
  const age = now() - lastMsg;
  let c = "ok", t = `<b>live</b> · updated <span data-ago="${lastMsg}">${ago(lastMsg)}</span>`;
  if (!lastMsg) { c = "idle"; t = "connecting…"; }
  else if (age > 20) { c = "bad"; t = `<b>no data</b> for ${dur(age)}. Is <code>ui/server.py</code> running?`; }
  else if (!source || source.readyState !== 1) { c = "warn"; t = `<b>polling</b> · updated <span data-ago="${lastMsg}">${ago(lastMsg)}</span>`; }
  $("conn").innerHTML = `<span class="dot ${c}"></span>${t}`;
}

function render() {
  if (!S) return;
  renderHeader();
  renderConn();
  if (VIEW === "repos") return renderRepos();
  if (VIEW === "tasks") return renderTasks();
  if (VIEW === "task") return renderTaskPage();
  if (VIEW === "agents") return renderAgentsView();
  if (VIEW === "rollouts") return renderRollouts();
  const v = renderWhere();
  renderLine();
  renderAgents();
  renderSpot(v);
  renderFeed();
}

// ---- data -----------------------------------------------------------------------------------------------------
function accept(snap) {
  if (UIV && snap.ui_version && snap.ui_version !== UIV) {
    try { sessionStorage.setItem("tf-mon-view", JSON.stringify({ SEL, FOLLOW, FEED })); } catch (e) {}
    return location.reload();
  }
  UIV = UIV || snap.ui_version;
  S = snap;
  lastMsg = now();
  if (snap.task && TASK !== snap.task) { TASK = snap.task; store.set("tf-mon-task", TASK); }
  if (REPO !== snap.repo_slug) { REPO = snap.repo_slug; store.set("tf-mon-repo", REPO); }
  if (PENDING && snap.task === PENDING.task) { SEL = PENDING.sel; FOLLOW = false; PENDING = null; }
  render();
}
function setView(v) {
  VIEW = v; store.set("tf-mon-view", v);
  clearTimeout(TP.timer);
  if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  Object.keys(cache).forEach(k => delete cache[k]);
  render();
}
function switchRepo(slug) {
  REPO = slug; TASK = ""; store.set("tf-mon-repo", REPO); store.set("tf-mon-task", "");
  S = null; SEL = null; FOLLOW = true; PENDING = null;
  Object.keys(cache).forEach(k => delete cache[k]);
  connect();
}
function switchTask(task, sel) {
  TASK = task; store.set("tf-mon-task", TASK); S = null; SEL = null; FOLLOW = !sel;
  PENDING = sel ? { task, sel } : null;
  Object.keys(cache).forEach(k => delete cache[k]);
  connect();
}
function connect() {
  if (source) source.close();
  clearInterval(pollTimer);
  if (location.protocol === "file:") {
    $("app").innerHTML = `<div class="panel offline">Open this page through the monitor: run <code>python3 ui/server.py</code> and go to <code>http://127.0.0.1:8777</code>.</div>`;
    return;
  }
  const q = "?" + new URLSearchParams({ task: TASK || "", repo: REPO || "" }).toString();
  try {
    source = new EventSource("/api/stream" + q);
    source.addEventListener("state", e => { try { accept(JSON.parse(e.data)); } catch (err) { console.error(err); } });
    source.onerror = () => renderConn();
  } catch (e) { source = null; }
  // Polling backs up the stream, so the page keeps updating if the stream drops.
  pollTimer = setInterval(() => {
    if (source && source.readyState === 1 && now() - lastMsg < 15) return;
    fetch("/api/state" + q).then(r => r.json()).then(accept).catch(() => renderConn());
  }, 4000);
  fetch("/api/state" + q).then(r => r.json()).then(accept).catch(() => renderConn());
}

// ---- ticking clocks without re-rendering ----------------------------------------------------------------------
setInterval(() => {
  const t = now();
  document.querySelectorAll("[data-since]").forEach(el => { el.textContent = (el.dataset.prefix || "") + dur(t - +el.dataset.since); });
  document.querySelectorAll("[data-ago]").forEach(el => { if (el.dataset.ago) el.textContent = ago(+el.dataset.ago); });
  document.querySelectorAll("[data-bar-start]").forEach(el => { el.style.width = Math.min(100, (t - +el.dataset.barStart) / +el.dataset.barBudget * 100) + "%"; });
  if (S) renderConn();
}, 1000);

// ---- input ----------------------------------------------------------------------------------------------------
function pick(sel) { SEL = sel; FOLLOW = false; render(); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-stage],[data-agent],[data-node],[data-file],[data-feed],[data-goto-task],[data-view],[data-repo],[data-open-task],[data-refresh-repo],[data-pkgfile],[data-tptab],[data-round],[data-monitor-task],[data-agf]");
  if (!t) return;
  if (t.dataset.pkgfile) { TP.file = t.dataset.pkgfile; return renderTaskPage(); }
  if (t.dataset.agf) { AGF = t.dataset.agf; return renderAgentsView(); }
  if (t.dataset.tptab) { TP.tab = t.dataset.tptab; return renderTaskPage(); }
  if (t.dataset.round) { TP.round = +t.dataset.round; return renderTaskPage(); }
  if (t.dataset.view) return setView(t.dataset.view);
  if (!S) return;
  if (t.dataset.file) return openFile(t.dataset.file);
  if (t.dataset.repo) return switchRepo(t.dataset.repo);
  if (t.dataset.openTask) return openTaskPage(t.dataset.openTask);
  if (t.dataset.monitorTask) { VIEW = "monitor"; store.set("tf-mon-view", VIEW); history.replaceState(null, "", "#monitor"); return switchTask(t.dataset.monitorTask, null); }
  if (t.dataset.refreshRepo) return postRepo("/api/repos/refresh", { slug: t.dataset.refreshRepo });
  if (t.dataset.gotoTask) {
    VIEW = "monitor"; store.set("tf-mon-view", VIEW); history.replaceState(null, "", "#monitor");
    return switchTask(t.dataset.gotoTask, t.dataset.gotoAgent ? { type: "agent", id: t.dataset.gotoAgent } : { type: "stage", id: +t.dataset.gotoStage });
  }
  if (t.dataset.feed) { FEED = t.dataset.feed; return renderFeed(); }
  if (t.dataset.stage) return pick({ type: "stage", id: +t.dataset.stage });
  if (t.dataset.agent) return pick({ type: "agent", id: t.dataset.agent });
  if (t.dataset.node) return pick({ type: "node", id: t.dataset.node });
});
$("follow").onclick = () => { FOLLOW = !FOLLOW; render(); };
$("task").onchange = e => { if (!e.target.value) return; if (VIEW === "task") openTaskPage(e.target.value); else switchTask(e.target.value, null); };
$("repo").onchange = e => {
  if (e.target.value === "__add") { e.target.value = REPO; setView("repos"); return $("repo-url").focus(); }
  switchRepo(e.target.value);
};
window.addEventListener("hashchange", () => {
  const before = VIEW + TP.task;
  readHash();
  if (VIEW + TP.task === before) return;
  if (VIEW === "task") openTaskPage(TP.task); else setView(VIEW);
});
if (VIEW === "task") setTimeout(() => openTaskPage(TP.task), 0);
function postRepo(path, body) {
  const msg = $("repo-msg");
  msg.className = "msg"; msg.textContent = "starting…";
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(r => r.json()).then(rec => {
      if (rec.error && !rec.slug) { msg.className = "msg bad"; msg.textContent = rec.error; return; }
      msg.className = "msg ok"; msg.textContent = "Digesting " + (rec.name || rec.slug) + "… progress shows below.";
      $("repo-url").value = "";
      switchRepo(rec.slug);
    }).catch(() => { msg.className = "msg bad"; msg.textContent = "The monitor server did not answer."; });
}
$("addrepo").onsubmit = e => {
  e.preventDefault();
  const url = $("repo-url").value.trim();
  if (!url) { $("repo-msg").className = "msg bad"; $("repo-msg").textContent = "Paste a repo link first."; return; }
  postRepo("/api/repos", { url });
};
$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store.set("tf-mon-theme", document.documentElement.dataset.theme);
};
const savedTheme = store.get("tf-mon-theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
document.addEventListener("keydown", e => {
  if (e.target.closest("select,input,textarea")) return;
  if (e.key === "Escape") { if ($("modal").classList.contains("open")) return closeFile(); FOLLOW = true; return render(); }
  if (!S || VIEW !== "monitor") return;
  if (e.key === "f" || e.key === "F") { FOLLOW = !FOLLOW; return render(); }
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    const cur = SEL && SEL.type === "stage" ? SEL.id : SEL && SEL.type === "agent" ? (agentById(SEL.id) || {}).stage || 1 : 1;
    const n = Math.min(16, Math.max(1, cur + (e.key === "ArrowRight" ? 1 : -1)));
    pick({ type: "stage", id: n });
  }
});

// ---- file viewer ----------------------------------------------------------------------------------------------
function openFile(path) {
  $("modal-title").textContent = path;
  $("modal-body").textContent = "loading…";
  $("modal").classList.add("open");
  fetch("/api/file?path=" + encodeURIComponent(path)).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(text => {
    if (/\.diff$/.test(path)) {
      $("modal-body").innerHTML = text.split("\n").map(l => {
        const c = l.startsWith("+") && !l.startsWith("+++") ? "diff-add" : l.startsWith("-") && !l.startsWith("---") ? "diff-del" : l.startsWith("@@") ? "diff-hunk" : "";
        return c ? `<span class="${c}">${esc(l)}</span>` : esc(l);
      }).join("\n");
    } else $("modal-body").textContent = text;
  }).catch(err => { $("modal-body").textContent = "Could not load this file (" + err + ")."; });
}
function closeFile() { $("modal").classList.remove("open"); }
$("modal-close").onclick = closeFile;
$("modal").onclick = e => { if (e.target === $("modal")) closeFile(); };

connect();
</script>
</body>
