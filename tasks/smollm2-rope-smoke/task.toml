schema_version = "1.4"
# Only the submission folder reaches the separate verifier container.
artifacts = ["/workspace/submission"]

[metadata]
author_name = "Task Factory"
difficulty = "medium"
category = "inference-optimization"
tags = ["gpu", "opencl", "adreno", "llm-inference", "fp16", "c++", "kernel-optimization"]
source_repo = "https://github.com/a8nova/adreno-llms"
source_commit = "887bd7e927e22374c56126fbc03bcb552b418481"
base_commit = "4f0f2af972fb08361524964f9b826a64fa5e4817"
port = "smollm2-135m-instruct"
device = "Motorola Razr 2020 (Snapdragon 765G, Adreno 620)"

[agent]
timeout_sec = 3600

[environment]
# The agent can reach the device gateway and nothing else, so it can't fetch the reference commit.
network_mode = "allowlist"
allowed_hosts = ["host.docker.internal"]
build_timeout_sec = 900.0
os = "linux"
mcp_servers = []

[environment.env]
TF_GATEWAY = "${TF_GATEWAY:-http://host.docker.internal:8798}"
TF_TASK = "smollm2-rope-smoke"
TF_AGENT_TIMEOUT = "3600"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["host.docker.internal"]

[verifier.env]
TF_GATEWAY = "${TF_GATEWAY:-http://host.docker.internal:8798}"
TF_TASK = "smollm2-rope-smoke"
TF_VERIFIER_KEY = "${TF_VERIFIER_KEY}"
TF_GATEWAY_HMAC = "${TF_GATEWAY_HMAC}"

[solution.env]
